[project]
name = "newsletter-machine"
version = "0.1.0"
description = "Deep-agent content machine for the Beyond the AI Demo newsletter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.32,<0.8",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-core>=1.0",
    "langgraph>=1.2",
    "python-dotenv>=1.0",
    "pyyaml>=6",
]

[project.scripts]
newsletter-machine = "newsletter_machine.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_machine"]

[tool.pytest.ini_options]
markers = ["live: calls the real Anthropic API"]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
