[project]
name = "newsletter-machine"
version = "0.1.0"
description = "Deep-agent content machine for the Beyond the AI Demo newsletter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.11",
    "deepagents>=0.7.32,<0.8",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "langchain>=1.4",
    "langchain-anthropic>=1.7",
    "langchain-core>=1.0",
    "langgraph>=1.2",
    "python-dotenv>=1.0",
    "python-substack==0.10.0",
    "pyyaml>=6",
    "requests>=2.34.2",
    "trafilatura>=2.3.1",
    "tzdata>=2025.2",
    "youtube-transcript-api>=1.2.4",
]

[project.optional-dependencies]
# renders the illustrator's SVGs to PNG/GIF for Substack; without it the draft links the SVG
render = ["playwright>=1.50", "pillow>=11"]

[project.scripts]
newsletter-machine = "newsletter_machine.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.50",
    "pillow>=11",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "types-requests>=2.33.0.20261030",
]

[tool.mda]
python-version = "3.13"  # the Managed Deep Agents image; matches .python-version

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_machine"]

[tool.pytest.ini_options]
markers = [
    "live: calls real external services (Anthropic API, Gmail, web pages, YouTube); run with -m live",
]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude"]  # plan/report Markdown holds illustrative snippets, not code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
